minversion = "4"
env_list = ["py314", "py313", "py312"]
isolated_build = true
skip_missing_interpreters = true

[env_run_base]
extras = ["dev"]
commands = [
    [
        'pytest',
        "tests",
        "--basetemp",
        "{envtmpdir}",
        { replace = "posargs", extend = true },
    ],
]

[gh-actions]
python = """
3.12: py312
3.13: py313
3.14: py314"""
